name: App image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/app-image.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/app-image.yml'
  workflow_dispatch:

concurrency:
  group: app-image-${{ github.ref }}
  # Never cancel a main run mid-deploy; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny everything by default; each job grants itself only what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/kuuratsanik/system-monitoring-app

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/server/requirements.lock
            src/server/requirements-dev.lock
      - run: pip install --require-hashes -r src/server/requirements-dev.lock
      - run: python -m pytest -q
        working-directory: src/server

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      packages: write # push the image to ghcr.io (only exercised on push to main)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Only pushes to main publish; every other event (PRs, manual runs) just builds.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pin the new image in the manifest so Argo CD sees a change and rolls the pods.
  # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit and push the pinned image reference back to main
    steps:
      # Credentials stay persisted here on purpose: this job pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          ref: main
      - name: Pin image tag in k8s/app.yaml
        env:
          TAG: sha-${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in sha256:[0-9a-f]*) ;; *) echo "Bad image digest: '${DIGEST}'" >&2; exit 1;; esac
          # Rewrite whatever is on the image line (tag, with or without an existing digest).
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]*#\1:${TAG}@${DIGEST}#" k8s/app.yaml
          sed -i -E "/name: APP_VERSION/{n;s#value: .*#value: ${TAG}#}" k8s/app.yaml
          git diff --exit-code k8s/app.yaml && { echo "Already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy: app ${TAG}"
          # main may have moved while the image built; retry the rebase+push a few times.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt}/3 failed" >&2
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

name: App image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/app-image.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/app-image.yml'
  workflow_dispatch:

concurrency:
  group: app-image-${{ github.ref }}
  # Never cancel a main run mid-deploy; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kuuratsanik/system-monitoring-app

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/server/requirements*.txt
      - run: pip install -r src/server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: src/server

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Pull requests only build the image; pushes to main also publish it.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pin the new image in the manifest so Argo CD sees a change and rolls the pods.
  # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin image tag in k8s/app.yaml
        env:
          TAG: sha-${{ github.sha }}
        run: |
          sed -i -E "s#(image: ${IMAGE}):.*#\1:${TAG}#" k8s/app.yaml
          sed -i -E "/name: APP_VERSION/{n;s#value: .*#value: ${TAG}#}" k8s/app.yaml
          git diff --exit-code k8s/app.yaml && { echo "Already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy: app ${TAG}"
          # main may have moved while the image built.
          git pull --rebase origin main
          git push origin HEAD:main

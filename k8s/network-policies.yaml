# NetworkPolicies for the default namespace. Selectors match the pod-template
# labels app=app, app=redis, app=haproxy, app=prometheus, app=loki, app=promtail
# and app=grafana in the other manifests.
# Kubelet liveness/readiness probes originate from the node and are not subject
# to NetworkPolicy on mainstream CNIs (Calico, Cilium, etc.), so probes keep working.
# Requires a CNI that enforces NetworkPolicy; otherwise these are silently ignored.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-app
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: app
    ports:
    - protocol: TCP
      port: 6379
  # Prometheus scrapes the redis_exporter sidecar.
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9121
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-allow-haproxy-prometheus
spec:
  podSelector:
    matchLabels:
      app: app
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: haproxy
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 5000
---
# Loki runs with auth_enabled: false, so restrict who can push and query:
# Promtail pushes logs, Grafana queries them. Ring/gRPC traffic stays on
# loopback (instance_addr 127.0.0.1) and is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-allow-promtail-grafana
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: promtail
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 3100

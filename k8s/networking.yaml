apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      # Default catch-all server. Grafana and Argo CD are intentionally NOT
      # exposed here; reach them with kubectl port-forward.
      server {
        listen 80 default_server;
        # Do not expose Prometheus metrics publicly. Prometheus scrapes the
        # app pods directly on port 5000, so this does not affect scraping.
        location = /metrics {
          return 404;
        }
        location / {
          # Always overwritten, so clients cannot spoof it; HAProxy passes it through.
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://haproxy:8080;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        # Config is mounted via subPath (no live reload): bump this whenever
        # the nginx-config ConfigMap changes so the pod restarts.
        checksum/config: "1"
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
  # Preserve the client source IP (needed for per-IP rate limiting). Tradeoff:
  # traffic is only routed to nodes that run an nginx pod.
  externalTrafficPolicy: Local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
data:
  haproxy.cfg: |
    global
        log stdout format raw local0
    
    defaults
        log global
        mode http
        timeout connect 5000ms
        timeout client 50000ms
        timeout server 50000ms
    
    frontend http_front
        bind *:8080
        default_backend http_back
    
    backend http_back
        balance roundrobin
        server app1 app-service:80 check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
      - name: haproxy
        image: haproxy:2.9
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
      volumes:
      - name: config-volume
        configMap:
          name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
spec:
  selector:
    app: haproxy
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

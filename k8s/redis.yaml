apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  annotations:
    # Never let Argo CD prune the data volume if this manifest is removed by mistake.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  # RWO volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4.11-alpine
        # The password is written to a config file in a memory-backed emptyDir so it
        # never appears in the process arguments (/proc/<pid>/cmdline, ps, pod spec).
        # Backslash and double quote are escaped for the redis config parser.
        command:
        - sh
        - -c
        - |
          set -e
          umask 077
          esc=$(printf '%s' "$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
          printf 'requirepass "%s"\n' "$esc" > /run/redis-auth/auth.conf
          exec redis-server --include /run/redis-auth/auth.conf --dir /data --appendonly yes
        ports:
        - name: redis
          containerPort: 6379
        env:
        # Secret created out-of-band (never in git): redis-auth, key password.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        # redis-cli reads this, so probes do not need the password on the command line.
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        readinessProbe:
          exec:
            command: [sh, -c, '[ "$(redis-cli ping)" = "PONG" ]']
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command: [sh, -c, '[ "$(redis-cli ping)" = "PONG" ]']
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: auth
          mountPath: /run/redis-auth
        - name: tmp
          mountPath: /tmp
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.93.0-alpine
        ports:
        - name: metrics
          containerPort: 9121
        env:
        - name: REDIS_ADDR
          value: localhost:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        readinessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsUser: 59000
          runAsGroup: 59000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
      - name: auth
        emptyDir:
          medium: Memory
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  selector:
    app: redis
  ports:
  - name: metrics
    protocol: TCP
    port: 9121
    targetPort: metrics

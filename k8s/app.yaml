apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: mediumautomationworkspace-app:latest # IMPORTANT: Replace with the actual image tag
        ports:
        - containerPort: 5000 # Assuming the app runs on port 5000
        livenessProbe:
          httpGet:
            path: /healthz # A common health check endpoint
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app: app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000

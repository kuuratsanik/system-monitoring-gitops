apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        # Built and pushed by .github/workflows/app-image.yml on every push to main;
        # its deploy job rewrites this tag (and APP_VERSION) to sha-<commit> so Argo CD rolls the pods.
        image: ghcr.io/kuuratsanik/system-monitoring-app:sha-a6395d2c657942849bf80ea51e316569335ad43f
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        - name: VISITS_CLIENT_IP_HEADER
          value: X-Real-IP
        - name: APP_VERSION
          value: sha-a6395d2c657942849bf80ea51e316569335ad43f
        # Redis is a soft dependency: the app serves in degraded mode without it.
        # Liveness uses /live (no Redis) so a hung Redis cannot kill pods.
        # Readiness uses /api/status (always 200 while the process is up),
        # not /health (503 when Redis is down), so a Redis outage neither empties
        # the Service nor restarts pods.
        readinessProbe:
          httpGet:
            path: /api/status
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app: app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000
